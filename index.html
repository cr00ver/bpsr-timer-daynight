<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スターレゾナンス 昼夜時計</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-main: #f0f6fc;
      --text-sub: #8b949e;
      --accent-day: #e3b341;
      --accent-night: #58a6ff;
      --border-color: #30363d;
      --btn-active: #238636;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.2rem;
      text-align: center;
      color: var(--text-sub);
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    /* モード切り替えスイッチ */
    .mode-selector {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
    }

    .mode-btn {
      flex: 1;
      padding: 8px;
      font-size: 0.8rem;
      font-weight: bold;
      border: none;
      background: transparent;
      color: var(--text-sub);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--btn-active);
      color: #fff;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 12px;
    }

    .status-day { background: rgba(227, 179, 65, 0.15); color: var(--accent-day); border: 1px solid var(--accent-day); }
    .status-night { background: rgba(88, 166, 255, 0.15); color: var(--accent-night); border: 1px solid var(--accent-night); }

    .main-clock {
      text-align: center;
      margin: 10px 0 24px;
    }

    .time-display {
      font-size: 3.5rem;
      font-weight: 800;
      font-family: monospace;
      letter-spacing: 2px;
      margin: 8px 0;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      background: rgba(13, 17, 23, 0.7);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .card h3 {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .card .time-value {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .info-box {
      margin-top: 24px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      border-left: 3px solid var(--accent-day);
      font-size: 0.8rem;
      color: var(--text-sub);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>スターレゾナンス 昼夜時計</h1>

    <!-- 仕様切り替えボタン -->
    <div class="mode-selector">
      <div id="btn24m" class="mode-btn active" style="text-align:center;cursor:default;">24分周期 (現実1分=1時間)</div>
      <!-- <button id="btn24m" class="mode-btn active" onclick="setMode('24m')">24分周期 (現実1分=1時間)</button> -->
      <!-- <button id="btn50m" class="mode-btn" onclick="setMode('50m')">旧ブルプロ仕様 (50分+補正)</button> -->
    </div>

    <div class="main-clock">
      <span id="statusBadge" class="status-badge status-day">☀️ 昼</span>
      <div id="gameTime" class="time-display">00:00</div>
    </div>

    <div class="countdown-grid">
      <div class="card">
        <h3>🌅 次の「日の出（昼）」</h3>
        <div id="nextSunrise" class="time-value">--分--秒後</div>
      </div>
      <div class="card">
        <h3>🌇 次の「日没（夜）」</h3>
        <div id="nextSunset" class="time-value">--分--秒後</div>
      </div>
    </div>

    <div id="infoText" class="info-box">
      【24分周期モード】現実の1分＝ゲーム内の1時間（昼12分 / 夜12分）。23:48正午(12:00)基準で計算しています。
    </div>
  </div>

  <script>
    let currentMode = '24m';

    // 基準アンカーの設定
    // 現実の23:36:00にゲーム内の「00:00」となる設定
    // （＝ 23:42に日の出 06:00、23:48に正午 12:00）
    const anchor24mOffsetSec = (23 * 60 + 36) * 60; // 23:36の秒換算 (84960秒)

    let schedule24m = [];
    let schedule50m = [];

    function buildSchedule24m() {
      const schedule = [];
      let currentMin = 0;
      for (let i = 0; i < 60; i++) {
        // 00:00 〜 06:00 (夜の後半: 6分)
        schedule.push({ type: 'night', start: currentMin, end: currentMin + 6 });
        currentMin += 6;
        // 06:00 〜 18:00 (昼: 12分)
        schedule.push({ type: 'day', start: currentMin, end: currentMin + 12 });
        currentMin += 12;
        // 18:00 〜 24:00 (夜の前半: 6分)
        schedule.push({ type: 'night', start: currentMin, end: currentMin + 6 });
        currentMin += 6;
      }
      return schedule;
    }

    function buildSchedule50m() {
      const schedule = [];
      let currentMin = 0;
      for (let i = 0; i < 29; i++) {
        schedule.push({ type: 'day', start: currentMin, end: currentMin + 25 });
        currentMin += 25;
        const nightDuration = (currentMin === 535) ? 15 : 25;
        schedule.push({ type: 'night', start: currentMin, end: currentMin + nightDuration });
        currentMin += nightDuration;
      }
      return schedule;
    }

    schedule24m = buildSchedule24m();
    schedule50m = buildSchedule50m();

    const gameTimeEl = document.getElementById('gameTime');
    const statusBadgeEl = document.getElementById('statusBadge');
    const nextSunriseEl = document.getElementById('nextSunrise');
    const nextSunsetEl = document.getElementById('nextSunset');
    const infoTextEl = document.getElementById('infoText');

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn24m').classList.toggle('active', mode === '24m');
      document.getElementById('btn50m').classList.toggle('active', mode === '50m');

      if (mode === '24m') {
        infoTextEl.innerHTML = '【24分周期モード】現実の1分＝ゲーム内の1時間（昼12分 / 夜12分）。23:48正午(12:00)基準で計算しています。';
      } else {
        infoTextEl.innerHTML = '【旧ブルプロ仕様モード】1日50分周期（昼25分 / 夜25分）。毎日 08:55〜09:10 の短縮夜補正（15分夜）が入ります。';
      }
      updateClock();
    }

    function updateClock() {
      const now = new Date();
      const secondsSinceMidnight = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

      let activeSchedule = schedule24m;
      let effectiveSec = secondsSinceMidnight;

      if (currentMode === '24m') {
        // 23:36(アンカー)からの経過秒数を計算（1日=24分=1440秒で周回）
        effectiveSec = (secondsSinceMidnight - anchor24mOffsetSec + 86400) % 1440;
        activeSchedule = schedule24m;
      } else {
        activeSchedule = schedule50m;
      }

      const currentMinutes = effectiveSec / 60;

      // 現在のフェーズを取得
      let phaseIdx = activeSchedule.findIndex(p => currentMinutes >= p.start && currentMinutes < p.end);
      if (phaseIdx === -1) phaseIdx = 0;

      const currentPhase = activeSchedule[phaseIdx];
      const isDay = currentPhase.type === 'day';

      // --- 昼夜ステータス ---
      if (isDay) {
        statusBadgeEl.textContent = '☀️ 昼';
        statusBadgeEl.className = 'status-badge status-day';
      } else {
        statusBadgeEl.textContent = '🌙 夜';
        statusBadgeEl.className = 'status-badge status-night';
      }

      // --- ゲーム内デジタル時刻表示 ---
      // 1440秒(24分) のうち何秒経過したかで 00:00〜24:00 を算出
      const totalGameHour = (effectiveSec / 1440) * 24;
      const gH = Math.floor(totalGameHour);
      const gM = Math.floor((totalGameHour - gH) * 60);
      gameTimeEl.textContent = `${String(gH).padStart(2, '0')}:${String(gM).padStart(2, '0')}`;

      // --- カウントダウン計算 ---
      let nextSunriseSec = 0;
      let nextSunsetSec = 0;

      if (currentMode === '24m') {
        // 次の 06:00 (日の出 = 6分時点 = 360秒) までの秒数
        let sunriseTargetSec = 360;
        if (effectiveSec >= sunriseTargetSec) sunriseTargetSec += 1440;
        nextSunriseSec = sunriseTargetSec - effectiveSec;

        // 次の 18:00 (日没 = 18分時点 = 1080秒) までの秒数
        let sunsetTargetSec = 1080;
        if (effectiveSec >= sunsetTargetSec) sunsetTargetSec += 1440;
        nextSunsetSec = sunsetTargetSec - effectiveSec;
      } else {
        if (isDay) {
          nextSunsetSec = (currentPhase.end * 60) - secondsSinceMidnight;
          const nextNight = activeSchedule[phaseIdx + 1];
          nextSunriseSec = nextNight 
            ? (nextNight.end * 60) - secondsSinceMidnight 
            : (86400 - secondsSinceMidnight) + (activeSchedule[0].end * 60);
        } else {
          nextSunriseSec = (currentPhase.end * 60) - secondsSinceMidnight;
          const nextDay = activeSchedule[phaseIdx + 1];
          nextSunsetSec = nextDay 
            ? (nextDay.end * 60) - secondsSinceMidnight 
            : (86400 - secondsSinceMidnight) + (activeSchedule[0].end * 60);
        }
      }

      formatCountdown(nextSunriseSec, nextSunriseEl);
      formatCountdown(nextSunsetSec, nextSunsetEl);
    }

    function formatCountdown(totalSec, element) {
      const m = Math.floor(totalSec / 60);
      const s = Math.floor(totalSec % 60);
      element.textContent = `${m}分 ${String(s).padStart(2, '0')}秒後`;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
